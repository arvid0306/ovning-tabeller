<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Tabeller</title>
</head>
<body>
    <main>
    <table> <!--skapar tabellen-->
    <caption>Intelprocessorer</caption>     <!--rubrik för tabell-->
        <thead> <!--skapar tabellhuvudet-->
            <tr>    <!--skapar tabellrad-->
                <th>    <!--skapar varje enskild cell-->
                    Namn
                </th>
                <th>
                    År
                </th>
                <th>
                    Klockfrekvens
                </th>
                <th>
                    Antal transistorer
                </th>
            </tr>
        </thead>
        <tbody> <!--skapar tabellkroppen-->
            <tr>    <!--skapar tabellrad-->
                <td>    <!--skapar varje enskild cell-->
                    Intel 8088
                </td>
                <td>
                    1979
                </td>
                <td>
                    4,77 MHz
                </td>
                <td>
                    29 000
                </td>
            </tr>
            <tr>
                <td>
                    Intel 80386DX
                </td>
                <td>
                    1985
                </td>
                <td>
                    16 MHz
                </td>
                <td>
                    275 000
                </td>
            </tr>
            <tr>
                <td>
                    Pentium
                </td>
                <td>
                    1993
                </td>
                <td>
                    60 MHz
                </td>
                <td>
                    3 100 000
                </td>
            </tr>
            <tr>
                <td>
                    Core i7
                </td>
                <td>
                    2008
                </td>
                <td>
                    3,33 GHz
                </td>
                <td>
                    781 000 000
                </td>
            </tr>
        </tbody>
    </table>
    </main>
</body>
</html>
